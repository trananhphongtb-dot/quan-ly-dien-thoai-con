name: Release APK + AAB

# Chạy tay (Actions → Release APK + AAB → Run workflow). Build xong sẽ tạo một
# GitHub Release có 2 file tải thẳng, không nén zip:
#   QuanLyDienThoaiCon.apk  (ký debug cố định, cài đè lên bản test được)
#   QuanLyDienThoaiCon.aab  (ký bằng upload key, để đưa lên Google Play)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses and install API 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore google-services.json from secret
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Missing repo secret GOOGLE_SERVICES_JSON" >&2
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json
      - name: Install Gradle 8.13
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Build debug APK and release AAB
        run: gradle assembleDebug bundleRelease --console=plain
      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/QuanLyDienThoaiCon.apk
          cp app/build/outputs/bundle/release/app-release.aab out/QuanLyDienThoaiCon.aab
          ls -la out
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" out/QuanLyDienThoaiCon.apk out/QuanLyDienThoaiCon.aab \
            --title "Quản lý điện thoại con $TAG" \
            --notes "APK để cài thử (cài đè được bản test trước) và AAB để đưa lên Google Play."
